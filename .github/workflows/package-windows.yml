name: Package Windows demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: maven
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: QuestTable-windows-x64
          path: |
            target/windows-package/*/QuestTable-*-windows-x64.zip
            target/windows-package/*/QuestTable-*-windows-x64.zip.sha256
          if-no-files-found: error
